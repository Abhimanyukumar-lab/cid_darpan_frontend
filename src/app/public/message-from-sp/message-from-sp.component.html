<div class="header-title">
  <span class="glob-span header-txt">{{
    "SP_MESSAGE.MESSAGE_TITLE" | translate
  }}</span>
</div>

<div class="container">
  <div class="row p-3">
    <div class="col-sm-12 col-md-6">
      <pre
        style="
          width: 100%;
          white-space: pre-line;
          text-align: justify;
          font-size: 17px;
          padding-right: 20px;
          margin-right: 20px;
        "
        >{{ districtDetails.aboutSp }}</pre
      >
    </div>
    <div
      class="col-sm-12 col-md-6 d-flex justify-content-center"
      style="height: 380px"
    >
      <div class="sp-img">
        <app-image-viewer
          [imageURL]="districtDetails.spImage"
          [imgWidth]="'100%'"
          [imgHeight]="'100%'"
        ></app-image-viewer>
      </div>
    </div>
  </div>
</div>
