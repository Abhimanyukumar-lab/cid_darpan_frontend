<div class="header-title">
  <span class="glob-span header-txt">{{
    "VIDEO_GALLERY.VIDEO_GALLERY_TITLE" | translate
  }}</span>
</div>
<div class="video" style="padding: 10px">
  <div *ngFor="let video of videoGallery">
    <div class="gallery-thumb" style="padding: 10px">
      <video
        *ngIf="
          (video.link.indexOf('avi') > -1 ||
            video.link.indexOf('mov') > -1 ||
            video.link.indexOf('mp4') > -1 ||
            video.link.indexOf('ogg') > -1 ||
            video.link.indexOf('wmv') > -1 ||
            video.link.indexOf('webm') > -1) &&
          video.link.indexOf('/viewFile/') > -1
        "
        src="{{ baseUrl + video.link }}"
        alt="IMAGE"
        width="100%"
        height="250"
        controls
      ></video>

      <video
        *ngIf="
          (video.link.indexOf('avi') > -1 ||
            video.link.indexOf('mov') > -1 ||
            video.link.indexOf('mp4') > -1 ||
            video.link.indexOf('ogg') > -1 ||
            video.link.indexOf('wmv') > -1 ||
            video.link.indexOf('webm') > -1) &&
          video.link.indexOf('/viewFile/') == -1
        "
        src="{{ video.link }}"
        alt="IMAGE"
        width="100%"
        height="250"
        controls
      ></video>

      <iframe
        *ngIf="video.link.indexOf('www.youtube.com') > -1"
        width="100%"
        height="250"
        [src]="video.link | Safe"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
    <h5>{{ video.title }}</h5>
  </div>
</div>

<div class="container-fluid" *ngIf="videoGallery && videoGallery.length == 0">
  <div
    style="
      width: 100%;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      background-color: white;
      color: red;
    "
  >
    {{ "COMMON.NO_DATA" | translate }}
  </div>
</div>
