<div class="header-title">
  <span class="glob-span header-txt">{{ "HOME.IMP_PLACE" | translate }}</span>
</div>

<div class="container">
  <div
    class="row px-2 py-2 my-2 border-bottom"
    *ngFor="let places of importantPlaces"
  >
    <div class="col-sm-12 col-md-4">
      <app-image-viewer
        [imageURL]="places.locationImage"
        [imgWidth]="'100%'"
        [imgHeight]="'100%'"
      ></app-image-viewer>
    </div>
    <div class="col-sm-12 col-md-8">
      <div class="col-12 description">
        {{ places.locationName }}
      </div>
      <div class="col-12 title" [ngClass]="{ showLess: !places.readMore }">
        {{ places.locationDiscription }}
      </div>
    </div>
    <div class="col-12 text-end py-3">
      <button
        *ngIf="places.readMore"
        (click)="readLess(places)"
        class="btn btn-light"
      >
        Read Less
      </button>
      <button
        *ngIf="!places.readMore"
        (click)="readMore(places)"
        class="btn btn-light"
      >
        Read More
      </button>
    </div>
  </div>
</div>

<div
  class="container-fluid"
  *ngIf="importantPlaces && importantPlaces.length == 0"
>
  <div
    style="
      width: 100%;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      background-color: white;
      color: red;
    "
  >
    {{ "COMMON.NO_DATA" | translate }}
  </div>
</div>
