<div class="assettype-edit">
  <div class="dashboard-header">
    {{ "ASSET_SUPPLIER.SUPPLIER_TITLE" | translate }}
  </div>
  <button
    class="btn btn-sm back-btn"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    "
    (click)="goBack()"
  >
    &#215;
  </button>
</div>
<div class="assettype-form">
  <form
    class="form needs-validation text-center container"
    novalidate
    [formGroup]="assetSupplierForm"
    autocomplete="off"
    novalidate="novalidate"
    id="assetSupplierForm"
  >
    <input id="id" name="id" formControlName="id" style="display: none" />

    <div class="row mb-2">
      <label for="supplierName" class="col-3 col-form-label">{{
        "ASSET_SUPPLIER.SUPP_NAME" | translate
      }}</label>
      <div class="col-9">
        <input
          type="text"
          id="supplierName"
          name="supplierName"
          *ngIf="language == 'hi'"
          placeholder="{{ 'ASSET_SUPPLIER.ENTR_SUPP_NAME' | translate }}"
          formControlName="supplierName"
          autocomplete="off"
          class="form-control hindi hindiFont"
          [ngClass]="{
            invalidInput: isControlHasErrors('supplierName')
          }"
          (change)="focusOut($event, 'supplierName')"
          (focusout)="focusOut($event, 'supplierName')"
          required
        />
        <input
          type="text"
          id="supplierName"
          name="supplierName"
          *ngIf="language == 'en'"
          placeholder="{{ 'ASSET_SUPPLIER.ENTR_SUPP_NAME' | translate }}"
          formControlName="supplierName"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('supplierName') }"
          required
        />
      </div>
      <div
        *ngIf="isControlHasError('supplierName', 'required')"
        class="invalid"
      >
        <strong>Supplier Name is required</strong>
      </div>
    </div>

    <div class="row mb-2">
      <label for="supplierAddress" class="col-3 col-form-label">{{
        "CONTACT.ADDRESS" | translate
      }}</label>
      <div class="col-9">
        <textarea
          *ngIf="language == 'hi'"
          id="supplierAddress"
          name="supplierAddress"
          placeholder="{{ 'CONTACT.SEL_ADDRESS' | translate }}"
          formControlName="supplierAddress"
          autocomplete="off"
          class="form-control Hindi hindiFont"
          [ngClass]="{
            invalidInput: isControlHasErrors('supplierAddress')
          }"
          (change)="focusOut($event, 'supplierAddress')"
          (focusout)="focusOut($event, 'supplierAddress')"
          required
        ></textarea>
        <textarea
          *ngIf="language == 'en'"
          id="supplierAddress"
          name="supplierAddress"
          placeholder="{{ 'CONTACT.SEL_ADDRESS' | translate }}"
          formControlName="supplierAddress"
          autocomplete="off"
          class="form-control"
          [ngClass]="{
            invalidInput: isControlHasErrors('supplierAddress')
          }"
          (change)="focusOut($event, 'supplierAddress')"
          (focusout)="focusOut($event, 'supplierAddress')"
          required
        ></textarea>
      </div>
      <div
        *ngIf="isControlHasError('supplierAddress', 'required')"
        class="invalid"
      >
        <strong>Supplier Address is required</strong>
      </div>
    </div>

    <div class="row mb-2">
      <label for="supplierMobileNo" class="col-3 col-form-label">{{
        "CONTACT.MOBILE_NO" | translate
      }}</label>
      <div class="col-9">
        <input
          type="text"
          id="supplierMobileNo"
          name="supplierMobileNo"
          (keypress)="numberOnly($event)"
          placeholder="{{ 'CONTACT.SEL_MOBILE_NO' | translate }}"
          maxlength="13"
          formControlName="supplierMobileNo"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('supplierMobileNo') }"
          required
        />
      </div>
      <div
        *ngIf="isControlHasError('supplierMobileNo', 'required')"
        class="invalid"
      >
        <strong>Supplier Mobile Number is required</strong>
      </div>
    </div>

    <div class="row mb-2">
      <label for="supplierContactNo" class="col-3 col-form-label">{{
        "CONTACT.CONTACT_NO" | translate
      }}</label>
      <div class="col-9">
        <input
          type="text"
          id="supplierContactNo"
          name="supplierContactNo"
          (keypress)="numberOnly($event)"
          placeholder="{{
            'DISTRICT_DETAILS.ENTER_DIST_CONTACT_NO' | translate
          }}"
          maxlength="13"
          formControlName="supplierContactNo"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('supplierContactNo') }"
        />
      </div>
    </div>

    <div class="row mb-2">
      <label for="supplierEmail" class="col-3 col-form-label">{{
        "CONTACT.EMAIL" | translate
      }}</label>
      <div class="col-9">
        <input
          type="text"
          id="supplierEmail"
          name="supplierEmail"
          placeholder="eg. abc@gmail.com"
          formControlName="supplierEmail"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('supplierEmail') }"
        />
      </div>
    </div>

    <div
      class="
        form-group
        d-flex
        flex-wrap
        justify-content-center
        align-items-center
      "
    >
      <button
        id="assetType_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="ADD_ASSETSUPPLIER && ADD_URL && !ASSETSUPPLIER_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
      <button
        id="question_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="EDIT_ASSETSUPPLIER && EDIT_URL && ASSETSUPPLIER_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
    </div>
  </form>
</div>
