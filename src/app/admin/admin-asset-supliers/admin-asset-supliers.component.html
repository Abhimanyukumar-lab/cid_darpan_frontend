<div class="assetDetails">
  <div class="dashboard-header">{{"ASSET_SUPPLIER.SUPPLIER_TITLE" | translate}}</div>
</div>

<div class="container-fluid mt-1">
  <div class="button-panel mb-1">
    <a
      routerLink="{{ permissions.add_url }}"
      class="btn btn-success m-2"
      *ngIf="permissions.add && permissions.add_url"
      >Add Supplier</a
    >
  </div>
  <div style="padding: 20px">
    <app-table-data
      [rows]="rows"
      [page]="page"
      [columns]="columns"
      [path]="path"
      [permissions]="permissions"
      [filterOptions]="filterOptions"
      [isApiAvailable]="false"
    >
    </app-table-data>
  </div>
</div>
