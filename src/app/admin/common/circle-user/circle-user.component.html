<div class="card m-3">
    <div class="card-header h5 text-white bg-secondary">
      <div class="row">
        <div class="col-sm-12 col-md-12">
          <span>Circle User Details</span>
        </div>
      </div>
    </div>
    <div class="card-body d-flex justify-content-between aling-item-center">
      <div class="container-fluid">
        <div class="row">
          <app-table-data
            [rows]="circleUserRows"
            [page]="circleUserPage"
            [columns]="circleUserColumns"
            [path]="circleUserPath"
            [permissions]="circleUserPermissions"
            [filterOptions]="filterOptions"
            [isApiAvailable]="false"
          >
          </app-table-data>
        </div>
      </div>
    </div>
  </div>
