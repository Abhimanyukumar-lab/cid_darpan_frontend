<div class="card m-3">
  <div class="card-header h5 text-white bg-secondary">
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <span>{{ "COMPLAINT.SENT_SMS" | translate }}</span>
      </div>
    </div>
  </div>
  <div class="card-body d-flex justify-content-between aling-item-center">
    <div class="container">
      <div class="row">
        <form
          class="form needs-validation text-center container"
          novalidate
          [formGroup]="sendSmsForm"
          autocomplete="off"
          novalidate="novalidate"
          id="sendSmsForm"
        >
          <input name="id" formControlName="id" style="display: none" />
          <div class="row mb-2">
            <div class="col-sm-12 col-md-12">
              <div class="row">
                <span class="glob-span col-sm-12 col-md-2">{{
                  "COMPLAINT.SEND_SMS_TITLE" | translate
                }}</span>

                <div class="col-sm-12 col-md-6">
                  <textarea
                    *ngIf="language == 'hi'"
                    name="message"
                    class="form-control hindi hindiFont"
                    formControlName="message"
                    placeholder="{{ 'COMPLAINT.ENTER_SMS' | translate }}"
                    [ngClass]="{
                      invalidInput: isControlHasErrors('discription')
                    }"
                    (change)="focusOut($event, 'discription')"
                    (focusout)="focusOut($event, 'discription')"
                    required
                  ></textarea>
                  <textarea
                    *ngIf="language == 'en'"
                    name="message"
                    class="form-control"
                    formControlName="message"
                    placeholder="{{ 'COMPLAINT.ENTER_SMS' | translate }}"
                    [ngClass]="{
                      invalidInput: isControlHasErrors('discription')
                    }"
                    (change)="focusOut($event, 'discription')"
                    (focusout)="focusOut($event, 'discription')"
                    required
                  ></textarea>
                  <div
                    *ngIf="isControlHasError('message', 'required')"
                    class="invalid"
                  >
                    <strong>Message is required</strong>
                  </div>
                </div>
                <div
                  class="
                    form-group
                    d-flex
                    justify-content-center
                    align-items-center
                    col-sm-12 col-md-4
                  "
                  style="margin-top: 5px"
                >
                  <button
                    (click)="submitSendSms()"
                    class="btn btn-primary w-25"
                    [disabled]="loading"
                  >
                    Submit
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
