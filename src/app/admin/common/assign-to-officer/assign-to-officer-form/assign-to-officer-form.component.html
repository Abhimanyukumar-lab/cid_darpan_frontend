<div class="card m-3">
  <div class="card-header h5 text-white bg-secondary">
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <span>{{ "COMPLAINT.ASSIGN_TO_OFFICER" | translate }}</span>
      </div>
    </div>
  </div>
  <div class="card-body d-flex justify-content-between aling-item-center">
    <div class="container">
      <div class="row">
        <form class="form needs-validation text-center container" novalidate [formGroup]="assignToOfficerForm"
          autocomplete="off" novalidate="novalidate" id="assignToOfficerForm">
          <input name="id" formControlName="id" style="display: none" />
          <div class="row mb-2">
            <div class="col-sm-12 col-md-6 mb-1">
              <span class="glob-span">{{
                "COMPLAINT.FORM_STATUS" | translate
                }}</span>
              <select name="status" formControlName="status" autocomplete="off" class="form-select" required>
                <option value="null" disabled selected>
                  {{ "COMPLAINT.SEL_COMP_STATUS" | translate }}
                </option>
                <option *ngIf="
                    assignForModule == 'COMPLAINT' ||
                    assignForModule == 'COMPLAINT_GPO' ||
                    assignForModule == 'COMPLAINT_GFPO' ||
                    assignForModule == 'CITIZENREPORT' ||
                    assignForModule == 'MISSINGPERSON' ||
                    assignForModule == 'DEADPERSON' ||
                    assignForModule == 'FOUNDPERSON' ||
                    assignForModule == 'PASSPORT' ||
                    assignForModule == 'VISITORS'
                  " value="Complaint Assigned to Officer">
                  {{ "COMPLAINT.ASSIGN_TO_OFFICER" | translate }}
                </option>
                <option *ngIf="assignForModule == 'CHARACTER'" value="Character Assigned to Officer">
                  {{ "COMPLAINT.ASSIGN_TO_OFFICER" | translate }}
                </option>
                <option *ngIf="
                    assignForModule == 'RECEIPT' ||
                    assignForModule == 'DISPATCH' ||
                    assignForModule == 'PROCECUTION' ||
                    assignForModule == 'RTI' ||
                    assignForModule == 'GRSECTION' ||
                    assignForModule == 'COMMISSION' ||
                    assignForModule == 'COURT'
                  " value="Assigned to Officer">
                  {{ "COMPLAINT.ASSIGN_TO_OFFICER" | translate }}
                </option>
              </select>
              <div *ngIf="isControlHasError('status', 'required')" class="invalid">
                <strong>Status is required</strong>
              </div>
            </div>

            <div class="col-sm-12 col-md-6">
              <span class="glob-span">{{
                "COMPLAINT.FORM_OFFICER" | translate
                }}</span>
              <textarea *ngIf="language == 'hi'" name="description" class="form-control hindi hindiFont"
                formControlName="description" placeholder="{{ 'COMPLAINT.ENTR_OFFICER_NAME' | translate }}" [ngClass]="{
                  invalidInput: isControlHasErrors('description')
                }" (change)="focusOut($event, 'description')" (focusout)="focusOut($event, 'description')"
                required></textarea>
              <textarea *ngIf="language == 'en'" name="description" class="form-control" formControlName="description"
                placeholder="{{ 'COMPLAINT.ENTR_OFFICER_NAME' | translate }}" [ngClass]="{
                  invalidInput: isControlHasErrors('description')
                }" (change)="focusOut($event, 'description')" (focusout)="focusOut($event, 'description')"
                required></textarea>
              <div *ngIf="isControlHasError('description', 'required')" class="invalid">
                <strong>Description is required</strong>
              </div>
            </div>
          </div>

          <div class="row d-flex justify-content-center align-items-center" style="margin-top: 5px">
            <button (click)="submitAssignToOfficer()" class="btn btn-primary w-25" [disabled]="loading">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
