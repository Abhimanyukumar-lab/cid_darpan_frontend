<div class="card m-3">
  <div class="card-header h5 text-white bg-secondary">
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <span>{{ "COURT.COURT_DETAILS" | translate }}</span>
      </div>
    </div>
  </div>
  <div class="card-body d-flex justify-content-between aling-item-center">
    <div class="container">
      <div class="row">
        <form
          class="form needs-validation text-center container"
          novalidate
          [formGroup]="courtDetailsForm"
          autocomplete="off"
          novalidate="novalidate"
          id="courtDetailsForm"
        >
          <input name="id" formControlName="id" style="display: none" />
          <div class="row mb-2">
            <div class="col-sm-4">
              <span class="glob-span"
                >{{ "PROCECUTION.NEXT_DATE" | translate }}:</span
              ><input
                type="date"
                class="form-control"
                formControlName="nextDate"
                placeholder="Enter Next Date"
                min="{{ min | date: 'yyyy-MM-dd' }}"
                [ngClass]="{ invalidInput: isControlHasErrors('nextDate') }"
              />
              <div
                *ngIf="isControlHasError('nextDate', 'required')"
                class="invalid"
              >
                <strong>Next Date is required</strong>
              </div>
            </div>

            <div class="col-sm-12 col-md-6">
              <span class="glob-span">{{
                "CITIZEN_REPORT.DESCRIPTION" | translate
              }}</span>
              <textarea
                *ngIf="language == 'hi'"
                name="description"
                class="form-control hindi hindiFont"
                formControlName="description"
                placeholder="{{
                  'TRANSFER.ENTER_TRANSFER_DESCRIPTION' | translate
                }}"
                [ngClass]="{
                  invalidInput: isControlHasErrors('description')
                }"
                (change)="focusOut($event, 'description')"
                (focusout)="focusOut($event, 'description')"
                required
              ></textarea>
              <textarea
                *ngIf="language == 'en'"
                name="description"
                class="form-control"
                formControlName="description"
                placeholder="{{
                  'TRANSFER.ENTER_TRANSFER_DESCRIPTION' | translate
                }}"
                [ngClass]="{
                  invalidInput: isControlHasErrors('description')
                }"
                (change)="focusOut($event, 'description')"
                (focusout)="focusOut($event, 'description')"
                required
              ></textarea>
              <div
                *ngIf="isControlHasError('description', 'required')"
                class="invalid"
              >
                <strong>Description is required</strong>
              </div>
            </div>

            <div
              class="
                form-group
                d-flex
                justify-content-center
                align-items-center
              "
              style="margin-top: 5px"
            >
              <button
                (click)="submitChangeStatus()"
                class="btn btn-primary w-25"
                [disabled]="loading"
              >
                Submit
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<app-court-details
  [courtDetailsPath]="courtDetailsPath"
  [deleteButtonCode]="courtDetailsDeleteCode"
  [deleteButtonUrl]="courtDetailsDeleteUrl"
  [courtDetailsModule]="courtDetailsModule"
  [courtDetailsId]="courtDetailsId"
></app-court-details>

<div
  class="form-group d-flex justify-content-center align-items-center"
  style="margin-top: 5px"
>
  <a [routerLink]="backUrl" class="btn btn-primary w-25"> Finish </a>
</div>
