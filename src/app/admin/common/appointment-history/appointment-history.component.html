<div class="card m-3">
  <div class="card-header h5 text-white bg-secondary">
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <span>{{ "APPOINTMENT.RESCHEDULE_TABLE" | translate }}</span>
      </div>
    </div>
  </div>
  <div class="card-body d-flex justify-content-between aling-item-center">
    <div class="container-fluid">
      <div class="row">
        <app-table-data
          [rows]="appHistoryRows"
          [page]="appHistoryPage"
          [columns]="appHistoryColumns"
          [path]="appHistoryPath"
          [permissions]="appHistoryPermissions"
          [isApiAvailable]="false"
        >
        </app-table-data>
      </div>
    </div>
  </div>
</div>
