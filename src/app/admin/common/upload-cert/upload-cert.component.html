<div class="card m-3">
  <div class="card-header h5 text-white bg-secondary">
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <span>{{ "COMPLAINT.UPLOAD_CERT" | translate }}</span>
      </div>
    </div>
  </div>
  <div class="card-body d-flex justify-content-between aling-item-center">
    <div class="container">
      <div class="row">
        <form
          class="form needs-validation text-center container"
          novalidate
          [formGroup]="sendSmsForm"
          autocomplete="off"
          novalidate="novalidate"
          id="sendSmsForm"
        >
          <input name="id" formControlName="id" style="display: none" />
          <div class="row mb-2">
            <div class="col-sm-12 col-md-12">
              <div class="row">
                <div class="col-12" style="color: #d23939">
                  <h6>{{ "COMPLAINT.UPLOAD_CERT_INFO" | translate }}</h6>
                </div>
              </div>
              <div class="row">
                <span
                  class="col-sm-12 col-md-2"
                  style="display: flex; align-items: center"
                  >{{ "COMPLAINT.UPLOAD_CERT" | translate }}</span
                >

                <div class="col-sm-12 col-md-6">
                  <input
                    type="file"
                    name="cert"
                    class="form-control"
                    accept="application/pdf"
                    (change)="handleFileChange($event.target.files)"
                    formControlName="cert"
                  />
                  <div
                    *ngIf="isControlHasError('cert', 'required')"
                    class="invalid"
                  >
                    <strong>Certificate is required</strong>
                  </div>
                </div>
                <div
                  class="
                    form-group
                    d-flex
                    justify-content-center
                    align-items-center
                    col-sm-12 col-md-4
                  "
                >
                  <button
                    (click)="submitSendSms()"
                    class="btn btn-primary w-25"
                    [disabled]="loading"
                  >
                    Upload
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
