<div class="headlines-edit">
  <div class="dashboard-header">
    {{ "HEADLINES.HEADLINES_DETAILS" | translate }}
  </div>
  <button
    class="btn btn-sm back-btn"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    "
    (click)="goBack()"
  >
    &#215;
  </button>
</div>
<div class="headlines-form">
  <form
    class="form needs-validation text-center container"
    novalidate
    [formGroup]="headlinesForm"
    autocomplete="off"
    novalidate="novalidate"
    id="headlines-form"
  >
    <input id="id" name="id" formControlName="id" style="display: none" />
    <div class="row mb-2">
      <label for="name" class="col-3 col-form-label">{{
        "FORMS.NAME" | translate
      }}</label>
      <div class="col-8">
        <input
          *ngIf="langModule.language == 'hi'"
          type="text"
          id="name"
          name="name"
          placeholder="{{ 'APPOINTMENT.ENTER_NAME' | translate }}"
          formControlName="name"
          autocomplete="off"
          class="form-control hindi hindiFont"
          [ngClass]="{
            invalidInput: isControlHasErrors('name')
          }"
          (change)="focusOut($event, 'name')"
          (focusout)="focusOut($event, 'name')"
          required
        />
        <input
          *ngIf="langModule.language == 'en'"
          type="text"
          id="name"
          name="name"
          placeholder="{{ 'APPOINTMENT.ENTER_NAME' | translate }}"
          formControlName="name"
          autocomplete="off"
          class="form-control"
          [ngClass]="{
            invalidInput: isControlHasErrors('name')
          }"
          (change)="focusOut($event, 'name')"
          (focusout)="focusOut($event, 'name')"
          required
        />
      </div>

      <div *ngIf="isControlHasError('name', 'required')" class="invalid">
        <strong>Name is required</strong>
      </div>
      <div *ngIf="isControlHasError('name', 'minlength')" class="invalid">
        <strong>Minimum 3 character required</strong>
      </div>
      <div *ngIf="isControlHasError('name', 'maxlength')" class="invalid">
        <strong>Max length allowed 320</strong>
      </div>
    </div>
    <div class="row mb-2">
      <label for="url" class="col-3 col-form-label">{{
        "FORMS.ATTACH_FILE" | translate
      }}</label>
      <div class="col-8">
        <input
          type="file"
          id="url"
          name="url"
          placeholder="Attach File"
          (change)="handleFileChange($event.target.files)"
          formControlName="url"
          autocomplete="off"
          class="form-control"
          accept="image/x-png,image/gif,image/jpeg"
          [ngClass]="{ invalidInput: isControlHasErrors('url') }"
          required
        />
      </div>
    </div>
    <div class="row mb-2">
      <label for="desc" class="col-3 col-form-label">{{
        "CITIZEN_REPORT.DESCRIPTION" | translate
      }}</label>
      <div class="col-8">
        <textarea
          *ngIf="langModule.language == 'hi'"
          type="text"
          id="desc"
          name="desc"
          placeholder="{{ 'CITIZEN_REPORT.SEL_DESCRIPTION' | translate }}"
          formControlName="desc"
          autocomplete="off"
          class="form-textarea hindi hindiFont"
          [ngClass]="{
            invalidInput: isControlHasErrors('desc')
          }"
          (change)="focusOut($event, 'desc')"
          (focusout)="focusOut($event, 'desc')"
          required
        ></textarea>
        <textarea
          *ngIf="langModule.language == 'en'"
          type="text"
          id="desc"
          name="desc"
          placeholder="{{ 'CITIZEN_REPORT.SEL_DESCRIPTION' | translate }}"
          formControlName="desc"
          autocomplete="off"
          class="form-textarea"
          [ngClass]="{
            invalidInput: isControlHasErrors('desc')
          }"
          (change)="focusOut($event, 'desc')"
          (focusout)="focusOut($event, 'desc')"
          required
        ></textarea>
      </div>
      <div *ngIf="isControlHasError('desc', 'required')" class="invalid">
        <strong>Description is required</strong>
      </div>
    </div>
    <div class="row mb-2">
      <label for="type" class="col-3 col-form-label">{{
        "HEADLINES.TYPE" | translate
      }}</label>
      <div class="col-8">
        <input
          type="text"
          id="type"
          maxlength="10"
          name="type"
          placeholder="{{ 'HEADLINES.TYPE' | translate }}"
          formControlName="type"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('type') }"
          required
        />
      </div>

      <div *ngIf="isControlHasError('type', 'required')" class="invalid">
        <strong> Purchase From is required</strong>
      </div>
    </div>

    <div class="row mb-2">
      <label for="priority" class="col-3 col-form-label">{{
        "FORMS.PRIORITY" | translate
      }}</label>
      <div class="col-8">
        <input
          type="number"
          id="priority"
          name="priority"
          placeholder="{{ 'FORMS.ENTER_PRIORITY' | translate }}"
          formControlName="priority"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('priority') }"
          required
        />
      </div>
      <div *ngIf="isControlHasError('priority', 'required')" class="invalid">
        <strong>Type is required</strong>
      </div>
      <div *ngIf="isControlHasError('priority', 'minlength')" class="invalid">
        <strong>Priority Minimum length is 1</strong>
      </div>
    </div>

    <div
      class="
        form-group
        d-flex
        flex-wrap
        justify-content-center
        align-items-center
      "
    >
      <button
        id="headlines_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="ADD_HEADLINES && ADD_URL && !HEADLINES_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
      <button
        id="headlines_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="EDIT_HEADLINES && EDIT_URL && HEADLINES_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
    </div>
  </form>
</div>
