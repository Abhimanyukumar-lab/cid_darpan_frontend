<div class="circle-insp">
  <div class="dashboard-header">
    {{ "CIRCLE_INSPECTOR.CIRCLE_DETAILS" | translate }}
  </div>
  <div class="button-panel">
    <a
      routerLink="{{ permissions.add_url }}"
      class="btn btn-success m-2"
      *ngIf="permissions.add && permissions.add_url"
      >Add Circle</a
    >
  </div>

  <div style="padding: 20px">
    <app-table-data
      [rows]="rows"
      [page]="page"
      [columns]="columns"
      [path]="path"
      [permissions]="permissions"
      [isApiAvailable]="false"
    >
    </app-table-data>
  </div>
</div>
