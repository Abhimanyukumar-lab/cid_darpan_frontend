<div class="viewContainer">
  <div class="card m-3 mt-0">
    <div
      class="
        card-body
        d-flex
        justify-content-between
        aling-item-center
        dashboard-header
      "
    >
      <h5>Circle Details</h5>
      <i
        class="material-icons"
        style="font-weight: bold; cursor: pointer"
        (click)="goBack()"
        placement="bottom"
        ngbTooltip="Close"
        >close</i
      >
    </div>
  </div>

  <div class="card m-3">
    <div class="card-header h5 text-white bg-secondary">
      <div class="row">
        <div class="col-sm-12 col-md-12">
          <div
            style="
              width: 100%;
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <span>Circle Details</span>
            <i
              class="material-icons m-1"
              style="cursor: pointer; color: #ffffff"
              placement="top"
              ngbTooltip="Edit Detail"
              (click)="editInfo()"
              *ngIf="permissions.edit"
            >
              mode
            </i>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body d-flex justify-content-between aling-item-center">
      <div class="container">
        <div class="row p-3" style="font-size: 16px">
          <div class="col-6">
            <div class="row">
              <div class="col-4">
                <span style="font-weight: 500">Circle Name :</span>
              </div>
              <div class="col-8" *ngIf="language == 'en'">
                {{ circle?.circleName }}
              </div>
              <div class="col-8" *ngIf="language == 'hi'">
                {{ circle?.circleNameHi }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <app-circle-user-form
      *ngIf="permissions.circleUserList"
      [url]="circleUserSubmitURL"
      [editUrl]="circleUserEditURL"
      [id]="circleUserId"
      [form]="circleUserForm"
    >
    </app-circle-user-form>

    <app-circle-user
      [circleUserPath]="circleUserPath"
      [circleUserDeleteCode]="circleUserDeleteCode"
      [circleUserEditCurrentFormCode]="circleUserEditCurrentFormCode"
      [circleUserDeleteUrl]="circleUserDeleteUrl"
      [circleUserId]="circleUserId"
      [form]="circleUserForm"
      (formOut)="getUpdatedForm($event)"
    >
    </app-circle-user>
  </div>
</div>
