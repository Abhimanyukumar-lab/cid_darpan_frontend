<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
  "
>
  <div class="dashboard-header"  style="flex-grow: 1; text-align: center">
    {{ "SUBDIVISION.SUBDIVISION_DETAILS" | translate }}
  </div>
  <button
    class="dashboard-header btn btn-sm back-btn"
    style="font-size: 30px"
    (click)="goBack()"
  >
    <!-- &#215; -->
    <i class="fa fa-arrow-left" aria-hidden="true"></i>
  </button>
</div>

<section class="table-sec">
  <div class="container">
    <div class="accordion" id="tableModule">
      <div class="card m-3">
        <div class="card-header" id="headingOne">
          <h5 class="mb-0 d-flex">
            <span
              class="justify-content-center text-left"
              style="cursor: pointer"
              (click)="toggle()"
              >
              {{ "SUBDIVISION.SUBDIVISION_DETAILS" | translate }}
            </span>
            <div
              *ngIf="!isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >add</i
              >
            </div>
            <div
              *ngIf="isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >remove</i
              >
            </div>
          </h5>
        </div>

        <div class="collapse show" *ngIf="isCollapsed">
          <div class="card-body">
            <form
              class="form needs-validation text-center container"
              novalidate
              [formGroup]="subdivisionForm"
              autocomplete="off"
              novalidate="novalidate"
              id="subdivision_form"
            >
              <input id="id" name="id" formControlName="id" style="display: none" />

              <div class="row">
                
                
                <div class="col-6">
                  <div class="row mb-2">
                    <label for="rangeId" style="font-weight: bold" class="col-3 col-form-label">
                      {{ "RANGE.RANGE_TITLE" | translate }}
                    </label>
                    <div class="col-8">
                      <select
                        name="rangeId"
                        id="rangeId"
                        formControlName="rangeId"
                        autocomplete="off"
                        class="form-select"
                        (change)="selectRange()"
                        [ngClass]="{invalidInput: isControlHasErrors('rangeId')}"
                        required
                      >
                      <option value="null" disabled>
                        Select Range
                      </option>
                      <option
                        *ngFor="let range of RangeList"
                        value="{{ range.id }}"
                      >
                        <span *ngIf="language == 'en'">{{range.rangeName}}</span>
                        <span *ngIf="language == 'hi'">{{range.rangeNameHi}}</span>
                      </option>
                    </select>
                    </div>
                  
                    <div *ngIf="isControlHasError('rangeId', 'required')" class="invalid">
                      <strong>Range is required</strong>
                    </div>
                    
                  </div>
                </div>
                
                <div class="col-6">
                  <div class="row mb-2">
                    <label for="districtId" style="font-weight: bold" class="col-3 col-form-label">
                      {{ "APPOINTMENT.DISTRICT" | translate }}
                    </label>
                    <div class="col-8">
                      <select
                        name="districtId"
                        id="districtId"
                        formControlName="districtId"
                        autocomplete="off"
                        class="form-select"
                        [ngClass]="{invalidInput: isControlHasErrors('districtId')}"
                        required
                      >
                      <option value="null" disabled>
                        Select Range
                      </option>
                      <option
                        *ngFor="let range of selectedDistrict"
                        value="{{ range.id }}"
                      >
                        <span *ngIf="language == 'en'">{{range.districtName}}</span>
                        <span *ngIf="language == 'hi'">{{range.districtNameHi}}</span>
                      </option>
                    </select>
                    </div>
                  
                    <div *ngIf="isControlHasError('districtId', 'required')" class="invalid">
                      <strong>District is required</strong>
                    </div>
                    
                  </div>
                </div>

                <div class="col-6">
                  <div class="row mb-2">
                    <label for="name" class="col-3 col-form-label"
                      >{{ "SUBDIVISION.SUBDIVISION_NAME" | translate }} (English)</label
                    >
                    <div class="col-8">
                      <input
                        type="text"
                        id="name"
                        name="name"
                        (keypress)="validAplpha($event)"
                        placeholder="{{
                          'SUBDIVISION.ENTER_SUBDIVISION_NAME' | translate
                        }}"
                        formControlName="name"
                        autocomplete="off"
                        class="form-control"
                        [ngClass]="{
                          invalidInput: isControlHasErrors('name')
                        }"
                        required
                      />
                    </div>
                    <div *ngIf="isControlHasError('name', 'required')" class="invalid">
                      <strong>Subdivision Name is required</strong>
                    </div>
                    <div *ngIf="isControlHasError('name', 'minlength')" class="invalid">
                      <strong>Minimum 3 character required</strong>
                    </div>
                    <div *ngIf="isControlHasError('name', 'maxlength')" class="invalid">
                      <strong>Max length allowed 320</strong>
                    </div>
                  </div>
                </div>
                
                <div class="col-6">
                  <div class="row mb-2">
                    <label for="nameHi" class="col-3 col-form-label"
                      >{{ "SUBDIVISION.SUBDIVISION_NAME" | translate }} (Hindi)</label
                    >
                    <div class="col-8">
                      <input
                        type="text"
                        id="nameHi"
                        name="nameHi"
                        (keypress)="validAplpha($event)"
                        placeholder="{{
                          'SUBDIVISION.ENTER_SUBDIVISION_NAME' | translate
                        }}"
                        formControlName="nameHi"
                        autocomplete="off"
                        class="form-control hindi hindiFont"
                        [ngClass]="{
                          invalidInput: isControlHasErrors('nameHi')
                        }"
                        (change)="focusOut($event, 'nameHi')"
                        (focusout)="focusOut($event, 'nameHi')"
                        required
                      />
                    </div>

                    <div *ngIf="isControlHasError('nameHi', 'required')" class="invalid">
                      <strong>Subdivision Name is required</strong>
                    </div>
                  </div>
                </div>

                    }}</label>
                    <div class="col-8">
                      <textarea

              </div>

              <div
                class="
                  form-group
                  d-flex
                  flex-wrap
                  justify-content-center
                  align-items-center
                "
              >
                <button
                  id="subdivision_submit"
                  (click)="submit()"
                  class="btn btn-primary px-9 py-9"
                  [disabled]="loading"
                  *ngIf="ADD_SUBDIVISION && ADD_URL && !SUBDIVISION_PARAMS.ID"
                >
                  Save
                  <div
                    class="spinner-border spinner-border-sm text-light align-middle"
                    *ngIf="loading"
                    role="status"
                  >
                    <span class="sr-only">Loading...</span>
                  </div>
                </button>
                <button
                  id="subdivision_submit"
                  (click)="submit()"
                  class="btn btn-primary px-9 py-9"
                  [disabled]="loading"
                  *ngIf="EDIT_SUBDIVISION && EDIT_URL && SUBDIVISION_PARAMS.ID"
                >
                  Save
                  <div
                    class="spinner-border spinner-border-sm text-light align-middle"
                    *ngIf="loading"
                    role="status"
                  >
                    <span class="sr-only">Loading...</span>
                  </div>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
