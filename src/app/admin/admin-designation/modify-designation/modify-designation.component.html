<div class="designation-edit">
  <div class="dashboard-header">
    {{ "DESIGNATION.DESIGN_DETAILS" | translate }}
  </div>
  <button
    class="btn btn-sm back-btn"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    "
    (click)="goBack()"
  >
    &#215;
  </button>
</div>

<div class="designation-form">
  <form
    class="form needs-validation text-center container"
    novalidate
    [formGroup]="designationForm"
    autocomplete="off"
    novalidate="novalidate"
    id="designationForm"
  >
    <input id="id" name="id" formControlName="id" style="display: none" />
    <div class="row mb-2">
      <label for="designationName" class="col-3 col-form-label"
        >{{ "DESIGNATION.DESIGN_NAME" | translate }}(English)</label
      >
      <div class="col-8">
        <input
          type="text"
          id="designationName"
          name="designationName"
          placeholder="{{ 'DESIGNATION.DESIGN_SEL_NAME' | translate }}"
          formControlName="designationName"
          autocomplete="off"
          class="form-control"
          [ngClass]="{
            invalidInput: isControlHasErrors('designationName')
          }"
          required
        />
      </div>

      <div
        *ngIf="isControlHasError('designationName', 'required')"
        class="invalid"
      >
        <strong>Designation Name in English is required</strong>
      </div>
    </div>
    <div class="row mb-2">
      <label for="designationNameHi" class="col-3 col-form-label"
        >{{ "DESIGNATION.DESIGN_NAME" | translate }}(Hindi)</label
      >
      <div class="col-8">
        <input
          type="text"
          id="designationNameHi"
          name="designationNameHi"
          placeholder="{{ 'DESIGNATION.DESIGN_SEL_NAME' | translate }}"
          formControlName="designationNameHi"
          autocomplete="off"
          class="form-control hindi hindiFont"
          [ngClass]="{
            invalidInput: isControlHasErrors('designationNameHi')
          }"
          (change)="focusOut($event, 'designationNameHi')"
          (focusout)="focusOut($event, 'designationNameHi')"
          required
        />
      </div>
      <div
        *ngIf="isControlHasError('designationNameHi', 'required')"
        class="invalid"
      >
        <strong>Designation Name in Hindi is required</strong>
      </div>
    </div>

    <div class="row mb-2">
      <label for="priority" class="col-3 col-form-label"
        >{{ "FORMS.PRIORITY" | translate }}</label
      >
      <div class="col-8">
        <input
        type="text"
        id="priority"
        name="priority"
        min="1"
        minlength="1"
        (keypress)="numberOnly($event)"
        placeholder="{{ 'FORMS.ENTER_PRIORITY' | translate }}"
        formControlName="priority"
        autocomplete="off"
        class="form-control"
        [ngClass]="{ invalidInput: isControlHasErrors('priority') }"
        required
        />
      </div>
      <div
        *ngIf="isControlHasError('priority', 'required')"
        class="invalid"
      >
        <strong>Priority is required</strong>
      </div>
    </div>
    <div
      class="
        form-group
        d-flex
        flex-wrap
        justify-content-center
        align-items-center
      "
    >
      <button
        id="events_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="ADD_DESIGN && ADD_URL && !DESIGN_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
      <button
        id="events_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="EDIT_DESIGN && EDIT_URL && DESIGN_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
    </div>
  </form>
</div>
