<div class="viewContainer">
  <div class="card m-3 mt-0">
    <div
      class="
        card-body
        d-flex
        justify-content-between
        aling-item-center
        dashboard-header
      "
    >
      <h5>Transfer Details</h5>
      <i
        class="material-icons"
        style="font-weight: bold; cursor: pointer"
        (click)="goBack()"
        placement="bottom"
        ngbTooltip="Close"
        >close</i
      >
    </div>
  </div>

  <div class="card m-3">
    <div class="card-header h5 text-white bg-secondary">
      <div class="row">
        <div class="col-sm-12 col-md-12">
          <span>Transfer Details</span>
        </div>
      </div>
    </div>
    <div class="card-body d-flex justify-content-between aling-item-center">
      <div class="container">
        <div class="row p-3" style="font-size: 16px">
          <div class="col-6">
            <div class="row">
              <div class="col-4">
                <span style="font-weight: 500">
                  {{ "CITIZEN_REPORT.NAME" | translate }}:
                </span>
              </div>
              <div class="col-8">{{ transfer.name }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card m-3">
    <div class="card-header h5 text-white bg-secondary">
      <div class="row">
        <div class="col-sm-12 col-md-12">
          <span>Transfer Resources</span>
        </div>
      </div>
    </div>
    <div class="card-body d-flex justify-content-between aling-item-center">
      <div class="container-fluid">
        <div class="row p-3">
          <div class="col-12">
            <app-table-data
              [rows]="rows"
              [page]="page"
              [columns]="columns"
              [path]="path"
              [permissions]="permissions"
            >
            </app-table-data>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card m-3">
    <div class="card-header h5 text-white bg-secondary">
      <div class="row">
        <div class="col-sm-12 col-md-12">
          <span>Transfer Locations</span>
        </div>
      </div>
    </div>
    <div class="card-body d-flex justify-content-between aling-item-center">
      <div class="container-fluid">
        <div class="row p-3">
          <div class="col-12">
            <app-table-data
              [rows]="locationRows"
              [page]="locationPage"
              [columns]="locationColumns"
              [path]="locationPath"
              [permissions]="locationPermissions"
            >
            </app-table-data>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
