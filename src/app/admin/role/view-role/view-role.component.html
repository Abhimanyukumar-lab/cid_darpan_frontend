<div class="view-role">
  <div class="dashboard-header">Role Information</div>
  <button
    class="btn btn-sm"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    "
    (click)="goBack()"
  >
    &#215;
  </button>
</div>

<div class="container">
  <div class="role-info">
    <div class="p-3">
      <div class="row">
        <div class="col text-center" style="font-size: 18px">
          Role Name : {{ role.roleName }}
        </div>
      </div>
    </div>
  </div>

  <ul ngbNav #nav="ngbNav" class="nav-tabs">
    <li ngbNavItem>
      <a ngbNavLink>Permission System</a>
      <ng-template ngbNavContent>
        <div class="permission-info">
          <h4>Permission List :</h4>
          <dual-list
            [source]="permissionList"
            [(destination)]="permissionSelected"
            [filter]="true"
            [key]="permissionId"
            [display]="permissionName"
          ></dual-list>
          <div class="text-center">
            <button
              class="btn btn-primary btn-sm m-3"
              *ngIf="updatePermissionButton"
              (click)="updatePermission()"
            >
              Update Permission
            </button>
          </div>
        </div>

        <div class="permission-info">
          <h4>Meun List :</h4>
          <dual-list
            [source]="menuList"
            [(destination)]="menuSelected"
            [filter]="true"
            [key]="menuId"
            [display]="menuName"
          >
          </dual-list>
          <div class="text-center">
            <button
              class="btn btn-primary btn-sm m-3"
              *ngIf="updateMenuButton"
              (click)="updateMenu()"
            >
              Update Meun
            </button>
          </div>
        </div>

        <div class="permission-info">
          <h4>SubMeun List :</h4>
          <dual-list
            [source]="submenuList"
            [(destination)]="submenuSelected"
            [filter]="true"
            [key]="submenuId"
            [display]="submenuName"
          ></dual-list>
          <div class="text-center">
            <button
              class="btn btn-primary btn-sm m-3"
              *ngIf="updateSubmenuButton"
              (click)="updateSubMenu()"
            >
              Update SubMeun
            </button>
          </div>
        </div>
      </ng-template>
    </li>
    <li ngbNavItem>
      <a ngbNavLink>System Config</a>
      <ng-template ngbNavContent>
        <div *ngFor="let module of moduleList">
          <table class="table table-bordered my-4">
            <thead>
              <tr>
                <th colspan="2">
                  {{ module.moduleName }}
                </th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let moduleSystemConfig of moduleSystemConfigList">
                <td style="width: 50%; vertical-align: middle">
                  {{
                    module.moduleName +
                      "." +
                      moduleSystemConfig.systemConfigName +
                      "." +
                      role.roleName | lowercase
                  }}
                </td>
                <td style="width: 50%">
                  <select
                    class="form-control form-control-sm"
                    name="{{
                      module.moduleName +
                        '.' +
                        moduleSystemConfig.systemConfigName +
                        '.' +
                        role.roleName | lowercase
                    }}"
                    id="{{
                      module.moduleName +
                        '.' +
                        moduleSystemConfig.systemConfigName +
                        '.' +
                        role.roleName | lowercase
                    }}"
                    (change)="onSelectChange($event)"
                  >
                    <option
                      *ngFor="
                        let opt of moduleSystemConfig.systemConfigValue.split(
                          ','
                        )
                      "
                      value="{{ opt }}"
                      [selected]="
                        selectedOne[
                          module.moduleName +
                            '.' +
                            moduleSystemConfig.systemConfigName +
                            '.' +
                            role.roleName | lowercase
                        ] == opt
                      "
                    >
                      {{ opt }}
                    </option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-center">
          <button class="btn btn-primary" (click)="updateSystemConfig()">
            Update
          </button>
        </div>
      </ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="nav"></div>
</div>
