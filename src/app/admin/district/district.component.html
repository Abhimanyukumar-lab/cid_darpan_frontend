<div class="sdpo">
    <div class="dashboard-header">{{ "DISTRICT_DETAILS.DIST_DETAILS_TITLE" | translate }}</div>
    <div class="button-panel">
      <a
        routerLink="{{ permissions.add_url }}"
        class="btn btn-success m-2"
        *ngIf="permissions.add && permissions.add_url"
        >Add District</a
      >
    </div>
  
    <div style="padding: 20px">
      <app-table-data
        [rows]="rows"
        [page]="page"
        [columns]="columns"
        [path]="path"
        [permissions]="permissions"
        [isApiAvailable]="false"
      >
      </app-table-data>
    </div>
  </div>
