<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
  "
>
  <div class="dashboard-header" style="flex-grow: 1; text-align: center">
    Add District
  </div>
  <button
    class="dashboard-header btn btn-sm back-btn"
    style="font-size: 30px"
    (click)="goBack()"
  >
    <!-- &#215; -->
    <i class="fa fa-arrow-left" aria-hidden="true"></i>
  </button>
</div>

<section class="table-sec">
  <div class="container">
    <div class="accordion" id="tableModule">
      <div class="card m-3">
        <div class="card-header" id="headingOne">
          <h5 class="mb-0 d-flex">
            <span
              class="justify-content-center text-left"
              style="cursor: pointer"
              (click)="toggle()"
              >District Details
            </span>
            <div
              *ngIf="!isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >add</i
              >
            </div>
            <div
              *ngIf="isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >remove</i
              >
            </div>
          </h5>
        </div>

        <div class="collapse show" *ngIf="isCollapsed">
          <div class="card-body">
            <form [formGroup]="entryForm">
              <input
                type="text"
                id="id"
                name="id"
                class="form-control"
                formControlName="id"
                hidden="hidden"
              />

              <div class="form-group">
                <div class="row">

                  <div
                    class="col-sm-12 col-md-6 col-lg-6 d-flex justify-content-start align-items-center my-2"
                  >
                    <div class="col-sm-4">
                      <label for="stateId" style="font-weight: bold"
                        >State</label
                      >
                    </div>
                    <div class="col-sm-8">
                        <select
                        name="stateId"
                        id="stateId"
                        placeholder="Select Police Station"
                        formControlName="stateId"
                        (change)="changeRangeData($event.target)"
                        autocomplete="off"
                        class="form-select"
                        required
                      >
                        <option value="null" disabled>
                          Select State
                        </option>
                        <option
                          *ngFor="let range of StateList"
                          value="{{ range.id }}"
                        >
                          <span *ngIf="language == 'en'">{{
                            range.stateName
                          }}</span>
                          <span *ngIf="language == 'hi'">{{
                            range.stateNameHi
                          }}</span>
                        </option>
                      </select>
                    </div>
                  </div>

                  <div
                    class="col-sm-12 col-md-6 col-lg-6 d-flex justify-content-start align-items-center my-2"
                  >
                    <div class="col-sm-4">
                      <label for="rangeId" style="font-weight: bold"
                        >Range</label
                      >
                    </div>
                    <div class="col-sm-8">
                        <select
                        name="rangeId"
                        id="rangeId"
                        placeholder="Select Range"
                        formControlName="rangeId"
                        autocomplete="off"
                        class="form-select"
                        required
                      >
                        <option value="null" disabled>
                          Select Range
                        </option>
                        <option
                          *ngFor="let range of RangeList"
                          value="{{ range.id }}"
                        >
                          <span *ngIf="language == 'en'">{{
                            range.rangeName
                          }}</span>
                          <span *ngIf="language == 'hi'">{{
                            range.rangeNameHi
                          }}</span>
                        </option>
                      </select>
                    </div>
                  </div>

                  <div
                    class="col-sm-12 col-md-6 col-lg-6 d-flex justify-content-start align-items-center my-2"
                  >
                    <div class="col-sm-4">
                      <label for="district_name" style="font-weight: bold"
                        >District Name</label
                      >
                    </div>
                    <div class="col-sm-8">
                      <input
                        type="text"
                        id="district_name"
                        name="district_name"
                        formControlName="district_name"
                        class="form-control"
                      />
                    </div>
                  </div>

                  <div
                    class="col-sm-12 col-md-6 col-lg-6 d-flex justify-content-start align-items-center my-2"
                  >
                    <div class="col-sm-4">
                      <label for="districtNameHi" style="font-weight: bold"
                        >District Name(Hi)</label
                      >
                    </div>
                    <div class="col-sm-8">
                      <input
                        type="text"
                        id="districtNameHi"
                        name="districtNameHi"
                        formControlName="districtNameHi"
                        class="form-control hindi hindiFont"
                        />
                      </div>
                    </div>
                    <!-- (change)="focusOut($event, 'districtNameHi')"
                    (focusout)="focusOut($event, 'districtNameHi')"  -->
                    
                  
                  
                </div>
              </div>
              <div class="text-center">
                <button
                  type="button"
                  class="btn btn-primary"
                  (click)="saveBasicDetails()"
                >
                  Save
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
