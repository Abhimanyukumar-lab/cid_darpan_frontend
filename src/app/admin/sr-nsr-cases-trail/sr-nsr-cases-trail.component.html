<div class="complaint">
    <div class="dashboard-header">
      Trail Database
    </div>
  
    <div style="padding: 20px">
      <app-table-data [rows]="rows" [page]="page" [columns]="columns" [path]="path" [permissions]="permissions"
        [filterOptions]="filterOptions" [isApiAvailable]="false">
      </app-table-data>
    </div>
  </div>
  
  <app-modal id="appModal" className="lg-modal">
    <div style="width: 100%; height: 100%; overflow: auto;">
      <div class="card m-3">
        <div class="card-header h5 text-white bg-secondary">
          <div class="row">
            <div class="col-sm-12 col-md-12">
              <span>Accused</span>
            </div>
          </div>
        </div>
        <div class="card-body d-flex justify-content-between aling-item-center">
          <div class="container-fluid">
            <div class="row" style="width: 100%; overflow: auto">
              <table id="cidAccusedData" style="width: 100%; overflow: auto"
                class="table table-striped table-bordered table-sm">
                <thead>
                  <tr>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Id
                    </td>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Name
                    </td>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Father's Name
                    </td>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Present Status
                    </td>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Chargesheet
                    </td>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Image
                    </td>
                    <td class="th-sm bg-dark text-white" style="font-weight: bold">
                      Updated Date
                    </td>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let accused of accuseds">
                    <td>{{ accused.id }}</td>
                    <td>{{ accused.name }}</td>
                    <td>{{ accused.fatherName }}</td>
                    <td>{{ accused.presentStatus }}</td>
                    <td>{{ accused.chargesheet }}</td>
                    <td>
                      <app-image-viewer imgWidth="80px" imgHeight="80px" [imageURL]="accused.personImage"
                        *ngIf="accused.personImage"></app-image-viewer>
                    </td>
                    <td>{{ accused.updatedDate | date: 'dd/MM/yyyy' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </app-modal>
