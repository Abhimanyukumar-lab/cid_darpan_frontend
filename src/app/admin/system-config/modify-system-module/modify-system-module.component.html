<div class="module-edit">
  <div class="dashboard-header">System Module Details</div>
  <button
    class="btn btn-sm back-btn"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    "
    (click)="goBack()"
  >
    &#215;
  </button>
</div>

<div class="module-form">
  <form
    class="form needs-validation text-center container"
    novalidate
    [formGroup]="systemModuleForm"
    autocomplete="off"
    novalidate="novalidate"
    id="systemModuleForm"
  >
    <input id="id" name="id" formControlName="id" style="display: none" />

    <div class="row mb-2">
      <label for="moduleName" class="col-3 col-form-label">Module Name</label>
      <div class="col-9">
        <input
          type="text"
          id="moduleName"
          name="moduleName"
          placeholder="Enter Module Name"
          formControlName="moduleName"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('moduleName') }"
          required
        />
      </div>
      <div *ngIf="isControlHasError('moduleName', 'required')" class="invalid">
        <strong>Module Name is required</strong>
      </div>
    </div>
    
    <div
      class="
        form-group
        d-flex
        flex-wrap
        justify-content-center
        align-items-center
      "
    >
      <button
        id="systemModule_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="ADD_SYS_MODULE && ADD_URL && !SYS_MODULE_PARAMS.ID"
      >
        Add System Configuration
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
      <button
        id="systemModule_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="EDIT_SYS_MODULE && EDIT_URL && SYS_MODULE_PARAMS.ID"
      >
        Edit System Configuration
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
    </div>
  </form>
</div>
