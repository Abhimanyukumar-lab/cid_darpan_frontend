<div class="events-edit">
  <div class="dashboard-header">Event Details</div>
  <button
    class="btn btn-sm back-btn"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    "
    (click)="goBack()"
  >
    &#215;
  </button>
</div>

<div class="events-form">
  <form
    class="form needs-validation text-center container"
    novalidate
    [formGroup]="eventsForm"
    autocomplete="off"
    novalidate="novalidate"
    id="eventsForm"
  >
    <input id="id" name="id" formControlName="id" style="display: none" />
    <div class="row mb-2">
      <label for="title" class="col-3 col-form-label">{{
        "FORMS.TITLE" | translate
      }}</label>
      <div class="col-8">
        <input
          *ngIf="language == 'hi'"
          type="text"
          id="title"
          name="title"
          placeholder="{{
            'DASHBOARD_NEWS_EVENT.TITLE_PLACEHOLDER' | translate
          }}"
          formControlName="title"
          autocomplete="off"
          class="form-control hindi hindiFont"
          [ngClass]="{
            invalidInput: isControlHasErrors('title')
          }"
          (change)="focusOut($event, 'title')"
          (focusout)="focusOut($event, 'title')"
          required
        />
        <input
          *ngIf="language == 'en'"
          type="text"
          id="title"
          name="title"
          placeholder="{{
            'DASHBOARD_NEWS_EVENT.TITLE_PLACEHOLDER' | translate
          }}"
          formControlName="title"
          autocomplete="off"
          class="form-control"
          [ngClass]="{
            invalidInput: isControlHasErrors('title')
          }"
          (change)="focusOut($event, 'title')"
          (focusout)="focusOut($event, 'title')"
          required
        />
      </div>

      <div *ngIf="isControlHasError('title', 'required')" class="invalid">
        <strong>Title is required</strong>
      </div>
    </div>

    <div class="row mb-2">
      <label for="priority" class="col-3 col-form-label">{{
        "FORMS.PRIORITY" | translate
      }}</label>
      <div class="col-8">
        <input
          type="number"
          id="priority"
          min="1"
          (keypress)="numberOnly($event)"
          name="priority"
          placeholder="{{ 'FORMS.ENTER_PRIORITY' | translate }}"
          formControlName="priority"
          autocomplete="off"
          class="form-control"
          [ngClass]="{ invalidInput: isControlHasErrors('priority') }"
          required
        />
      </div>
      <div *ngIf="isControlHasError('priority', 'required')" class="invalid">
        <strong>Priority is required</strong>
      </div>
      <div *ngIf="isControlHasError('priority', 'minlength')" class="invalid">
        <strong>Priority Minimum length is 1</strong>
      </div>
    </div>

    <div
      class="
        form-group
        d-flex
        flex-wrap
        justify-content-center
        align-items-center
      "
    >
      <button
        id="events_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="ADD_EVENTS && ADD_URL && !EVENTS_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
      <button
        id="events_submit"
        (click)="submit()"
        class="btn btn-primary px-9 py-9"
        [disabled]="loading"
        *ngIf="EDIT_EVENTS && EDIT_URL && EVENTS_PARAMS.ID"
      >
        Save
        <div
          class="spinner-border spinner-border-sm text-light align-middle"
          *ngIf="loading"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </button>
    </div>
  </form>
</div>
