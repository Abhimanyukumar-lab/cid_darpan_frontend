<div class="card">
  <div class="card-header">
    <h2>{{ 'USER.PROFILE_HEADING' | translate }}</h2>
  </div>
  <div class="card-body">
    <!-- Search and Filter Section (if needed) -->
    <div class="row mb-3">
      <div class="col-md-12">
        <!-- Add search/filter inputs here if required -->
      </div>
    </div>

    <!-- Main Data Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="thead-dark">
          <tr>
            <th *ngFor="let col of columns" [width]="col.size + '%'">
              {{ col.colName | translate }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of rows; let i = index">
            <!-- ID -->
            <td>{{ row.id }}</td>

            <!-- First Name -->
            <td>{{ row.firstName }}</td>

            <!-- Subdivision Name (Updated to show name instead of ID) -->
            <td>{{ row.subdivisionName || 'N/A' }}</td>

            <!-- Last Name -->
            <td>{{ row.lastName }}</td>

            <!-- Mobile Number -->
            <td>{{ row.mobileNo }}</td>

            <!-- Email -->
            <td>{{ row.email }}</td>

            <!-- User Image -->
            <td>
              <img
                *ngIf="row.userImage"
                [src]="row.userImage"
                alt="User Image"
                class="img-thumbnail"
                style="max-width: 80px; max-height: 80px;"
              />
              <span *ngIf="!row.userImage">No Image</span>
            </td>

            <!-- Role Name -->
            <td>{{ row.roleName }}</td>

            <!-- Actions -->
            <td>
              <button
                *ngIf="permissions.edit"
                class="btn btn-sm btn-primary mr-2"
                (click)="editUser(row.id)"
              >
                <i class="fas fa-edit"></i> Edit
              </button>
              <button
                *ngIf="permissions.delete"
                class="btn btn-sm btn-danger"
                (click)="deleteUser(row.id)"
              >
                <i class="fas fa-trash"></i> Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination (if needed) -->
    <div class="row mt-3">
      <div class="col-md-12">
        <nav *ngIf="page.totalElements > 0">
          <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="page.pageNumber === 0">
              <a class="page-link" (click)="previousPage()">Previous</a>
            </li>
            <li
              class="page-item"
              *ngFor="let p of getPages()"
              [class.active]="p === page.pageNumber"
            >
              <a class="page-link" (click)="goToPage(p)">{{ p + 1 }}</a>
            </li>
            <li
              class="page-item"
              [class.disabled]="page.pageNumber >= page.totalPages - 1"
            >
              <a class="page-link" (click)="nextPage()">Next</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
