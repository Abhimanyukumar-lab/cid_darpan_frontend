<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
  "
>
  <div class="dashboard-header" style="flex-grow: 1; text-align: center">
    Major Head Form
  </div>
  <button
    class="dashboard-header btn btn-sm back-btn"
    style="font-size: 30px"
    (click)="goBack()"
  >
    <!-- &#215; -->
    <i class="fa fa-arrow-left" aria-hidden="true"></i>
  </button>
</div>

<section class="table-sec">
  <div class="container">
    <div class="accordion" id="tableModule">
      <div class="card m-3">
        <div class="card-header" id="headingOne">
          <h5 class="mb-0 d-flex">
            <span
              class="justify-content-center text-left"
              style="cursor: pointer"
              (click)="toggle()"
              >Major Head Form
            </span>
            <div
              *ngIf="!isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >add</i
              >
            </div>
            <div
              *ngIf="isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >remove</i
              >
            </div>
          </h5>
        </div>

        <div class="collapse show" *ngIf="isCollapsed">
          <div class="card-body">
            
            <form class="form needs-validation container" novalidate [formGroup]="entryForm" autocomplete="off"
              novalidate="novalidate" id="menu_form">
              <div class="col-sm-12">
                <div class="row">
                  <input id="id" name="id" formControlName="id" style="display: none" />
                  <div class="col-sm-12">
                    <label for="nameOfCrimeCategory" class="col-12 col-form-label">{{
                      "SR_NSR_CASE_MAJOR_HEAD.NAME" | translate
                      }}</label>
                    <div class="col-9">
                      <input type="text" id="nameOfCrimeCategory" name="nameOfCrimeCategory"
                        placeholder="{{ 'SR_NSR_CASE_MAJOR_HEAD.NAME' | translate }}" formControlName="nameOfCrimeCategory"
                        autocomplete="off" class="form-control" [ngClass]="{
                          invalidInput: isControlHasErrors('nameOfCrimeCategory')
                        }" required />
                      <!-- (keypress)="validAplpha($event)" -->
                    </div>

                    <div *ngIf="isControlHasError('nameOfCrimeCategory', 'required')" class="invalid">
                      <strong> Major Head Name is required</strong>
                    </div>
                  </div>
                  <div class="col-sm-12">
                    <label for="nameOfCrimeCategoryHi" class="col-12 col-form-label">{{
                      "SR_NSR_CASE_MAJOR_HEAD.NAME" | translate
                      }}(Hi)</label>
                    <div class="col-9">
                      <input type="text" id="nameOfCrimeCategoryHi" name="nameOfCrimeCategoryHi"
                        placeholder="{{ 'SR_NSR_CASE_MAJOR_HEAD.NAME' | translate }}" formControlName="nameOfCrimeCategoryHi"
                        autocomplete="off" class="form-control hindi hindiFont" [ngClass]="{
                          invalidInput: isControlHasErrors('nameOfCrimeCategoryHi')
                        }" required (keypress)="validAplpha($event)" (change)="focusOut($event, 'nameOfCrimeCategoryHi')"
                        (focusout)="focusOut($event, 'nameOfCrimeCategoryHi')" />
                      <!-- (keypress)="validAplpha($event)" -->
                    </div>

                    <div *ngIf="isControlHasError('nameOfCrimeCategoryHi', 'required')" class="invalid">
                      <strong> Major Head Name Hi is required</strong>
                    </div>
                  </div>
                  <!-- <div class="col-sm-12">
                    <div class="col-12 col-form-label">
                      <label for="chargesheet">Chargesheet Monitoring Days</label>
                    </div>
                    <div class="col-9">
                      <input type="number" name="chargesheetMonitoringDays" id="chargesheetMonitoringDays" class="form-control"
                        formControlName="chargesheetMonitoringDays"
                        [ngClass]="{invalidInput: isControlHasErrors('chargesheetMonitoringDays')}" />

                      <div *ngIf="isControlHasError('chargesheetMonitoringDays','required')" class="invalid">
                        <strong> Chargesheet Monitoring Days is required</strong>
                      </div>
                    </div>
                  </div> -->
                </div>
              </div>

              <br />

              <div class="form-group d-flex flex-wrap justify-content-center align-items-center">
                <button id="menu_submit" (click)="submit()" class="btn btn-primary px-9 py-9" [disabled]="loading"
                  *ngIf="ADD_ENTRY && ADD_URL && !ENTRY_PARAMS.ID">
                  Add Entry
                  <div class="spinner-border spinner-border-sm text-light align-middle" *ngIf="loading" role="status">
                    <span class="sr-only">Loading...</span>
                  </div>
                </button>
                <button id="menu_submit" (click)="submit()" class="btn btn-primary px-9 py-9" [disabled]="loading"
                  *ngIf="EDIT_ENTRY && EDIT_URL && ENTRY_PARAMS.ID">
                  Edit Entry
                  <div class="spinner-border spinner-border-sm text-light align-middle" *ngIf="loading" role="status">
                    <span class="sr-only">Loading...</span>
                  </div>
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>

    </div>
  </div>
</section>
