<div
  style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
  "
>
  <div class="dashboard-header" style="flex-grow: 1; text-align: center">
    Modus Operandi Form
  </div>
  <button
    class="dashboard-header btn btn-sm back-btn"
    style="font-size: 30px"
    (click)="goBack()"
  >
    <!-- &#215; -->
    <i class="fa fa-arrow-left" aria-hidden="true"></i>
  </button>
</div>

<section class="table-sec">
  <div class="container">
    <div class="accordion" id="tableModule">
      <div class="card m-3">
        <div class="card-header" id="headingOne">
          <h5 class="mb-0 d-flex">
            <span
              class="justify-content-center text-left"
              style="cursor: pointer"
              (click)="toggle()"
              >Modus Operandi Form
            </span>
            <div
              *ngIf="!isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >add</i
              >
            </div>
            <div
              *ngIf="isCollapsed"
              style="justify-content: flex-end; align-items: flex-end"
            >
              <i
                class="material-icons"
                style="cursor: pointer"
                (click)="toggle()"
                >remove</i
              >
            </div>
          </h5>
        </div>

        <div class="collapse show" *ngIf="isCollapsed">
          <div class="card-body">
            <form class="form needs-validation container" novalidate [formGroup]="entryForm" autocomplete="off"
              novalidate="novalidate" id="menu_form">
              <div class="col-sm-12">
                <div class="row">
                  <input id="id" name="id" formControlName="id" style="display: none" />
                  <div class="col-sm-12 d-flex">
                    <label for="cidCrimeCategoryId" class="col-3 col-form-label">{{
                      "SR_NSR_CASE_MAJOR_HEAD.TITLE" | translate
                      }}</label>
                    <div class="col-9 py-2">
                      <select id="cidCrimeCategoryId" name="cidCrimeCategoryId" formControlName="cidCrimeCategoryId"
                        class="form-control hindi hindiFont" [ngClass]="{
                          invalidInput: isControlHasErrors('cidCrimeCategoryId')
                        }" required (change)="showSubMajorHead()">
                        <option value="null" disabled>
                          {{ "SR_NSR_CASE_MAJOR_HEAD.SELECT" | translate }}
                        </option>
                        <option *ngFor="let majorHead of majorHeads" [value]="majorHead.id">
                          <span *ngIf="language == 'en'">{{
                            majorHead.nameOfCrimeCategory
                            }}</span>
                          <span *ngIf="language == 'hi'">{{
                            majorHead.nameOfCrimeCategoryHi
                            }}</span>
                        </option>
                      </select>
          
                      <div *ngIf="isControlHasError('cidCrimeCategoryId', 'required')" class="invalid">
                        <strong> Major Head Name is required</strong>
                      </div>
                    </div>
                  </div>
          
                  <div class="col-sm-12 d-flex">
                    <label for="cidCrimeSubCategoryId" class="col-3 col-form-label">{{
                      "SR_NSR_CASE_MODUS_OPERANDI.SELECT_SMH" | translate
                      }}</label>
                    <div class="col-9 py-2">
                      <select id="cidCrimeSubCategoryId" name="cidCrimeSubCategoryId" formControlName="cidCrimeSubCategoryId"
                        class="form-control hindi hindiFont" [ngClass]="{
                          invalidInput: isControlHasErrors('cidCrimeSubCategoryId')
                        }" required>
                        <option value="null" disabled>
                          {{ "SR_NSR_CASE_MODUS_OPERANDI.SELECT_SMH" | translate }}
                        </option>
                        <option *ngFor="let majorHead of selectedSubMajerHead" [value]="majorHead.id">
                          <span *ngIf="language == 'en'">{{
                            majorHead.typeOfCrime
                            }}</span>
                          <span *ngIf="language == 'hi'">{{
                            majorHead.typeOfCrimeHi
                            }}</span>
                        </option>
                      </select>
          
                      <div *ngIf="isControlHasError('cidCrimeSubCategoryId', 'required')" class="invalid">
                        <strong> Sub Major Head Name is required</strong>
                      </div>
                    </div>
                  </div>
          
                  <div class="col-sm-12 d-flex">
                    <label for="name" class="col-3 col-form-label">{{
                      "SR_NSR_CASE_MODUS_OPERANDI.TITLE" | translate
                      }}</label>
                    <div class="col-9 py-2">
                      <input type="text" id="name" name="name" placeholder="{{ 'SR_NSR_CASE_MODUS_OPERANDI.TITLE' | translate }}"
                        formControlName="name" autocomplete="off" class="form-control" [ngClass]="{
                          invalidInput: isControlHasErrors('name')
                        }" required />
          
                      <div *ngIf="isControlHasError('name', 'required')" class="invalid">
                        <strong>Modus operandi Name is required</strong>
                      </div>
                    </div>
                  </div>
          
                  <div class="col-sm-12 d-flex">
                    <label for="nameHi" class="col-3 col-form-label">{{
                      "SR_NSR_CASE_MODUS_OPERANDI.TITLE" | translate
                      }}(Hi)</label>
                    <div class="col-9 py-2">
                      <input type="text" id="nameHi" name="nameHi"
                        placeholder="{{ 'SR_NSR_CASE_MODUS_OPERANDI.TITLE' | translate }}" formControlName="nameHi"
                        autocomplete="off" class="form-control hindi hindiFont" [ngClass]="{
                          invalidInput: isControlHasErrors('nameHi')
                        }" required (keypress)="validAplpha($event)" (change)="focusOut($event, 'nameHi')"
                        (focusout)="focusOut($event, 'nameHi')" />
          
                      <div *ngIf="isControlHasError('namnameHie', 'required')" class="invalid">
                        <strong>Modus operandi Name Hi is required</strong>
                      </div>
                    </div>
                  </div>
          
                  <div class="col-sm-12 d-flex">
                    <label for="desc" class="col-3 col-form-label">{{
                      "SR_NSR_CASE_MODUS_OPERANDI.DESC" | translate
                      }}</label>
                    <div class="col-9 py-2">
                      <textarea id="desc" name="desc" placeholder="{{ 'SR_NSR_CASE_MODUS_OPERANDI.DESC' | translate }}"
                        formControlName="desc" autocomplete="off" class="form-control hindi hindiFont" [ngClass]="{
                          invalidInput: isControlHasErrors('desc')
                        }" required></textarea>
          
                      <div *ngIf="isControlHasError('desc', 'required')" class="invalid">
                        <strong>Modus operandi description is required</strong>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
          
              <br />
          
              <div class="form-group d-flex flex-wrap justify-content-center align-items-center">
                <button id="menu_submit" (click)="submit()" class="btn btn-primary px-9 py-9" [disabled]="loading"
                  *ngIf="ADD_ENTRY && ADD_URL && !ENTRY_PARAMS.ID">
                  Add Entry
                  <div class="spinner-border spinner-border-sm text-light align-middle" *ngIf="loading" role="status">
                    <span class="sr-only">Loading...</span>
                  </div>
                </button>
                <button id="menu_submit" (click)="submit()" class="btn btn-primary px-9 py-9" [disabled]="loading"
                  *ngIf="EDIT_ENTRY && EDIT_URL && ENTRY_PARAMS.ID">
                  Edit Entry
                  <div class="spinner-border spinner-border-sm text-light align-middle" *ngIf="loading" role="status">
                    <span class="sr-only">Loading...</span>
                  </div>
                </button>
              </div>
            </form>
            
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
