<div class="complaint">
  <div class="dashboard-header">
    {{ "SR_NSR_CASE_SUB_MAJOR_HEAD.TITLE" | translate }}
  </div>

  <div class="button-panel">
    <button
      (click)="goToLink(permissions.add_url)"
      class="btn btn-success m-2"
      *ngIf="permissions.add && permissions.add_url"
    >
      Add Sub Major Head
    </button>
  </div>

  <div style="padding: 20px">
    <app-table-data
      [rows]="rows"
      [page]="page"
      [columns]="columns"
      [path]="path"
      [permissions]="permissions"
      [filterOptions]="filterOptions"
      [isApiAvailable]="false"
    >
    </app-table-data>
  </div>
</div>
